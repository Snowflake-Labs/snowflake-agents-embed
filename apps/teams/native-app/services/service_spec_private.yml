# SPCS service spec for NETWORK_MODE=hybrid and privatelink (see service_spec.yml for
# the public spec this mirrors, and CONFIG.SET_NETWORK_MODE in setup/setup.sql).
#
# Only the "# private-only" lines differ from service_spec.yml; the lint in
# scripts/lint-service-specs.sh fails if anything else drifts. They switch the
# container to the SPCS-injected internal SNOWFLAKE_HOST, which keeps working after
# public logins are disabled. Forwarded user tokens from that host arrive from a
# 10.x address, so they need enableCustomCredentials plus a COMPUTE_POOL network
# rule on CORTEX_TEAMS_OAUTH (the wizard's Network tab generates that SQL).
#
# Never add executeAsCaller here: COMPUTE_POOL rules do not cover caller's-rights
# tokens.
spec:
  containers:
    - name: agents-teams-app
      image: /agents_teams_app_db/public/na_image_repo/agents-teams-app:latest
      env:
        TEAMS_AUTH_MODE: production
        SNOWFLAKE_HOST_MODE: internal # private-only
        ARTIFACTS_INTEGRATION_ENABLED: "true"
        # Feature flags; each gates one optional capability in the chat UI.
        FF_FILE_UPLOAD: "true"
        FF_SKILLS: "true"
        FF_DEEP_RESEARCH: "true"
        FF_WEB_SEARCH: "true"
        # Off by default: date/chart experimental
        # flags now always go out on :run (see chat-core datePreamble.ts). This flag only
        # adds the extra undocumented stream fields (enableStepTrace / enableAnalystStreaming /
        # enableRelatedQueries / responseSchemaVersion v2).
        FF_NATIVE_STREAM_FLAGS: "false"
      secrets:
        - snowflakeSecret:
            objectName: CONFIG.BOT_APP_ID
          secretKeyRef: secret_string
          envVarName: BOT_APP_ID
        - snowflakeSecret:
            objectName: CONFIG.BOT_APP_SECRET
          secretKeyRef: secret_string
          envVarName: BOT_APP_SECRET
        - snowflakeSecret:
            objectName: CONFIG.OBO_CLIENT_ID
          secretKeyRef: secret_string
          envVarName: OBO_CLIENT_ID
        - snowflakeSecret:
            objectName: CONFIG.OBO_CLIENT_SECRET
          secretKeyRef: secret_string
          envVarName: OBO_CLIENT_SECRET
        - snowflakeSecret:
            objectName: CONFIG.DEFAULT_AGENT_FQN
          secretKeyRef: secret_string
          envVarName: DEFAULT_AGENT_FQN
        - snowflakeSecret:
            objectName: CONFIG.TEAMS_APP_ID
          secretKeyRef: secret_string
          envVarName: TEAMS_APP_ID
        - snowflakeSecret:
            objectName: CONFIG.AGENT_ALLOW_LIST
          secretKeyRef: secret_string
          envVarName: AGENT_ALLOW_LIST
        - snowflakeSecret:
            objectName: CONFIG.AZURE_TENANT_ID
          secretKeyRef: secret_string
          envVarName: AZURE_TENANT_ID
        - snowflakeSecret:
            objectName: CONFIG.SNOWFLAKE_SCOPE
          secretKeyRef: secret_string
          envVarName: SNOWFLAKE_SCOPE
        - snowflakeSecret:
            objectName: CONFIG.APPS_API_HOST
          secretKeyRef: secret_string
          envVarName: APPS_API_HOST
        - snowflakeSecret:
            objectName: CONFIG.ALLOWED_ORIGINS
          secretKeyRef: secret_string
          envVarName: ALLOWED_ORIGINS
        # Computed at install time by setup.sql (org-account form, not the locator or the
        # .privatelink host - see SnowflakeHostMode in
        # packages/cortex-server/src/snowflake/credential.ts).
        - snowflakeSecret:
            objectName: CONFIG.SNOWFLAKE_ACCOUNT_NAME
          secretKeyRef: secret_string
          envVarName: SNOWFLAKE_ACCOUNT
      resources:
        requests:
          cpu: "0.5"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      readinessProbe:
        port: 3000
        path: /healthz
  endpoints:
    - name: https
      port: 3000
      public: true
      # corsSettings cannot read a secret. CONFIG.CREATE_SERVER_SERVICE /
      # ROLL_SERVER_SERVICE bind cdn_origin as a JSON array via USING.
      corsSettings:
        Access-Control-Allow-Origin: {{ cdn_origin }}
        Access-Control-Allow-Methods: ["POST", "GET"]
        Access-Control-Allow-Headers: ["Authorization", "Content-Type", "X-User-Access-Token"]
capabilities: # private-only
  securityContext: # private-only
    enableCustomCredentials: true # private-only
# Deliberately NOT in this file: externalAccessIntegrations and minInstances. Both are
# rejected here as unknown spec options for a Native App's FROM SPECIFICATION - they are
# CREATE SERVICE clauses instead, which setup/setup.sql's CONFIG.CREATE_SERVER_SERVICE /
# ROLL_SERVER_SERVICE procedures already supply directly (EXTERNAL_ACCESS_INTEGRATIONS,
# MIN_INSTANCES).
