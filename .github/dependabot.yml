#
# Paused (open-pull-requests-limit: 0) while this repo stages in Snowflake-Solutions.
# Remove the limits when the repo moves to Snowflake-Labs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # @typescript-eslint peer range is <6.1.0
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/apps/teams"
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
